# Template rendered by deploy/deploy.sh. It substitutes ${IMAGE}, ${UPSTREAM},
# ${UPSTREAM_PUBLIC_ORIGIN}, ${PUBLIC_ORIGIN}, and ${UPSTREAM_TLS_NAME} and
# rejects any remaining placeholder; do not apply this file directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricetag-patternfly
  namespace: pricetag-patternfly
  annotations:
    openshift.io/description: PriceTag metering UI
    openshift.io/display-name: PriceTag
  labels:
    app.kubernetes.io/name: pricetag-patternfly
    app.kubernetes.io/instance: pricetag-patternfly
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: pricetag-patternfly
    app.kubernetes.io/managed-by: pricetag-deploy
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pricetag-patternfly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pricetag-patternfly
        app.kubernetes.io/instance: pricetag-patternfly
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/component: ui
        app.kubernetes.io/part-of: pricetag-patternfly
        app.kubernetes.io/managed-by: pricetag-deploy
    spec:
      serviceAccountName: pricetag-patternfly
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pricetag-patternfly
      containers:
        - name: ui
          # The image ENTRYPOINT (/usr/local/bin/pricetag-entrypoint) renders
          # the mounted nginx ConfigMap and execs nginx; no command override.
          # The image is pinned by digest by deploy/deploy.sh.
          image: "${IMAGE}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: UPSTREAM
              value: "${UPSTREAM}"
            - name: UPSTREAM_PUBLIC_ORIGIN
              value: "${UPSTREAM_PUBLIC_ORIGIN}"
            - name: PUBLIC_ORIGIN
              value: "${PUBLIC_ORIGIN}"
            # nginx matches DNS SANs, not IP SANs. deploy.sh validates this
            # name against the live certificate before rendering the
            # manifest; the chain is verified with the CA below.
            - name: UPSTREAM_TLS_NAME
              value: "${UPSTREAM_TLS_NAME}"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The template routes every nginx writable path to /tmp, but keep
            # the conventional cache/run directories writable as well so a
            # future config tweak cannot break readOnlyRootFilesystem.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: nginx-config
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: gateway-ca
              mountPath: /etc/nginx/ca
              readOnly: true
          # Health checks are deliberately local. A gateway outage must not
          # mark every pod unready/restarting; deploy.sh separately probes the
          # gateway-backed /whoami through the Route.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 128Mi
          terminationMessagePolicy: FallbackToLogsOnError
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: nginx-config
          configMap:
            name: pricetag-nginx-config
            defaultMode: 0444
        # The bundle carries the public Praxis test CA; deploy/deploy.sh
        # refreshes this ConfigMap from CA_FILE for the target environment.
        - name: gateway-ca
          configMap:
            name: pricetag-gateway-ca
            defaultMode: 0444
