    kind: Service
    name: praxis
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gateway-models
  namespace: pricetag-backend
  labels:
    app: praxis
    app.kubernetes.io/part-of: pricetag-backend
spec:
  host: ${GATEWAY_HOST}
  path: /v1/models
  port:
    targetPort: unified
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: praxis
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gateway-messages
  namespace: pricetag-backend
  annotations:
    haproxy.router.openshift.io/timeout: 300s
  labels:
    app: praxis
    app.kubernetes.io/part-of: pricetag-backend
spec:
  host: ${GATEWAY_HOST}
  path: /v1/messages
  port:
    targetPort: unified
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: praxis
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: gateway-health
  namespace: pricetag-backend
  labels:
    app: praxis
    app.kubernetes.io/part-of: pricetag-backend
spec:
