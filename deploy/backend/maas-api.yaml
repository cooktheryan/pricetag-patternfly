# maas-api: standalone MaaS key service (source: redhat-et/maas-api, image
# mirror: quay.io/redhat-et/enmaas-api). Validates and mints the API keys the
# metering service and praxis gateway authenticate with. Runs its schema
# migrations in an init container (AppSRE enmaas-api template pattern).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-api
  namespace: pricetag-backend
  labels:
    app: maas-api
    app.kubernetes.io/name: maas-api
    app.kubernetes.io/component: key-service
    app.kubernetes.io/part-of: pricetag-backend
    app.kubernetes.io/managed-by: pricetag-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maas-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: maas-api
        app.kubernetes.io/name: maas-api
        app.kubernetes.io/component: key-service
        app.kubernetes.io/part-of: pricetag-backend
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: migrate-database
          image: quay.io/redhat-et/enmaas-api@sha256:6368a5ce2ff403876979ebc7ad26b04a8ba38737c575ff7269ad7c879fcc2670
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |
              import os
              import time
              from app.migrate import run_migrations

              deadline = time.monotonic() + int(os.environ['READINESS_SECONDS'])
              while True:
                  try:
                      run_migrations(os.environ['DATABASE_URL'])
                      print('MaaS API database schema initialized', flush=True)
                      break
                  except Exception:
                      if time.monotonic() >= deadline:
                          raise SystemExit('MaaS API database initialization timed out') from None
                      print('Waiting for MaaS API database initialization', flush=True)
                      time.sleep(2)
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DB_CONNECTION_URL
                  name: maas-db-config
            - name: READINESS_SECONDS
              value: "180"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: maas-api
          image: quay.io/redhat-et/enmaas-api@sha256:6368a5ce2ff403876979ebc7ad26b04a8ba38737c575ff7269ad7c879fcc2670
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DB_CONNECTION_URL
                  name: maas-db-config
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MAAS_SUBSCRIPTION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MAAS_SUBSCRIPTION_MODE
              value: standalone
            - name: TENANT
              value: models-as-a-service
            - name: API_KEY_MAX_EXPIRATION_DAYS
              value: "90"
            - name: SECURE
              value: "false"
            - name: DEBUG_MODE
              value: "false"
            - name: PORT
              value: "8080"
            - name: METRICS_PORT
              value: "9090"
            - name: METRICS_SECURE
              value: "false"
            - name: LOG_LEVEL
              value: INFO
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: maas-api
  namespace: pricetag-backend
  labels:
    app: maas-api
    app.kubernetes.io/name: maas-api
    app.kubernetes.io/component: key-service
    app.kubernetes.io/part-of: pricetag-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: metrics
  selector:
    app: maas-api
